<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tap Challenge Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="user-info">
                <img id="userPhoto" src="https://via.placeholder.com/40" alt="User">
                <span id="userName">Loading...</span>
            </div>
            <div class="balance-box">
                <span class="coin-icon">🪙</span>
                <span id="balance">0</span>
            </div>
        </header>

        <!-- Energy Bar -->
        <div class="energy-section">
            <div class="energy-label">
                <span>⚡ Energy</span>
                <span id="energyText">1000/1000</span>
            </div>
            <div class="energy-bar">
                <div id="energyFill" class="energy-fill"></div>
            </div>
        </div>

        <!-- Tap Area -->
        <main class="tap-area">
            <div id="tapCoin" class="tap-coin">
                <img src="https://cdn-icons-png.flaticon.com/512/217/217853.png" alt="Coin">
            </div>
            <div id="tapPoints" class="tap-points"></div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="home">
                <span>🏠</span>
                <small>Home</small>
            </button>
            <button class="nav-btn" data-tab="boost">
                <span>🚀</span>
                <small>Boost</small>
            </button>
            <button class="nav-btn" data-tab="friends">
                <span>👥</span>
                <small>Friends</small>
            </button>
            <button class="nav-btn" data-tab="tasks">
                <span>📋</span>
                <small>Tasks</small>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
